  flyway:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    
server:
  port: ${SERVER_PORT:8080}
